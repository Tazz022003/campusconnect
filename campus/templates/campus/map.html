<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusConnect Map</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e3a5f; color: #fff; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 1.1rem; margin: 0; }
    #search { padding: 8px 10px; border-radius: 6px; border: none; min-width: 260px; }
    .wrap { position: relative; flex: 1; }
    #map { position: absolute; inset: 0; }
    #results { position: absolute; top: 10px; right: 10px; z-index: 1000; background: #fff; border-radius: 8px;
               box-shadow: 0 2px 8px rgba(0,0,0,.3); max-height: 50%; overflow-y: auto; min-width: 240px; display: none; }
    #results div { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #eee; font-size: .9rem; }
    #results div:hover { background: #eef3fa; }
    #results small { color: #666; }
    #directions { position: absolute; left: 10px; top: 90px; z-index: 1000; background: #fff; border-radius: 8px;
                  box-shadow: 0 2px 8px rgba(0,0,0,.3); padding: 10px 12px; width: 250px; font-size: .85rem; }
    #directions h2 { font-size: .95rem; margin: 0 0 8px; }
    #directions select { width: 100%; padding: 5px; margin-bottom: 6px; }
    #directions button { padding: 6px 10px; border: 0; border-radius: 6px; cursor: pointer; }
    #dir-go { background: #f58220; color: #fff; }
    #dir-clear { background: #e5e7ee; }
    #dir-info { margin-top: 8px; font-weight: 600; }
    #directions small { display: block; color: #777; margin-top: 6px; font-size: .7rem; }
  </style>
</head>
<body>
  <header>
    <h1>CampusConnect</h1>
    <a href="/" style="color:#fff;text-decoration:none;font-size:.9rem">&larr; Dashboard</a>
    <input id="search" type="search" placeholder="Search a room, building or facility..." autocomplete="off">
  </header>

  <div class="wrap">
    <div id="map"></div>
    <div id="results"></div>

    <div id="directions">
      <h2>Walking directions</h2>
      <select id="dir-from" aria-label="From building"></select>
      <select id="dir-to" aria-label="To building"></select>
      <button id="dir-go" type="button">Get directions</button>
      <button id="dir-clear" type="button">Clear</button>
      <div id="dir-info"></div>
      <small>Routing by OSRM (FOSSGIS) &middot; &copy; OpenStreetMap contributors</small>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Default view: Palawan State University Main Campus (Tiniguiban Heights, Puerto Princesa)
    const map = L.map('map').setView([9.77778, 118.73333], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markers = {};   // building id -> marker

    // ---- Edit mode: drag a marker to the right spot and it saves automatically. ----
    // You must be logged in (e.g. via /admin/) in this browser. Set to false when done.
    const EDIT_MODE = true;

    async function saveLocation(b, marker) {
      const { lat, lng } = marker.getLatLng();
      const csrf = document.querySelector('meta[name="csrf-token"]').content;
      try {
        const res = await fetch(`/api/buildings/${b.id}/`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
          body: JSON.stringify({ latitude: lat.toFixed(6), longitude: lng.toFixed(6) }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        marker.setPopupContent(`<strong>${esc(b.name)}</strong><br>Saved: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
        marker.openPopup();
      } catch (err) {
        alert('Could not save location (' + err.message + '). Make sure you are logged in at /admin/.');
      }
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s ?? '';
      return d.innerHTML;
    }

    function popupHtml(b) {
      let html = `<strong>${esc(b.name)}</strong>`;
      if (b.department_name) html += `<br><small>${esc(b.department_name)}</small>`;
      if (b.description) html += `<p>${esc(b.description)}</p>`;
      if (b.image) html += `<img src="${esc(b.image)}" style="max-width:200px;border-radius:6px">`;
      return html;
    }

    async function loadBuildings() {
      const res = await fetch('/api/buildings/');
      const data = await res.json();
      const buildings = data.results ?? data;   // works with or without pagination

      fillDirectionSelects(buildings);

      const points = [];
      buildings.forEach(b => {
        const pos = [parseFloat(b.latitude), parseFloat(b.longitude)];
        points.push(pos);
        const marker = L.marker(pos, { draggable: EDIT_MODE }).addTo(map).bindPopup(popupHtml(b));
        if (EDIT_MODE) marker.on('dragend', () => saveLocation(b, marker));
        markers[b.id] = marker;
      });
      map.invalidateSize();
      if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 18 });
    }

    // ---- Room / office search ----
    const input = document.getElementById('search');
    const results = document.getElementById('results');
    let timer;

    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { results.style.display = 'none'; return; }
      timer = setTimeout(() => searchRooms(q), 300);   // debounce
    });

    async function searchRooms(q) {
      const enc = encodeURIComponent(q);
      const list = d => d.results ?? d;
      const [rooms, buildings, facilities] = await Promise.all([
        fetch('/api/rooms/?search=' + enc).then(r => r.json()).then(list),
        fetch('/api/buildings/?search=' + enc).then(r => r.json()).then(list),
        fetch('/api/facilities/?search=' + enc).then(r => r.json()).then(list),
      ]);

      // Combine everything into one list; each item points to a building marker
      const items = [
        ...buildings.map(b => ({ title: b.name, sub: 'Building', buildingId: b.id })),
        ...rooms.map(r => ({ title: r.name, sub: `${r.building_name} · floor ${r.floor}`, buildingId: r.building })),
        ...facilities.map(f => ({ title: f.name, sub: `Facility · ${f.building_name}`, buildingId: f.building })),
      ];

      results.innerHTML = '';
      if (!items.length) {
        results.innerHTML = '<div>No results found</div>';
      }
      items.forEach(it => {
        const el = document.createElement('div');
        el.innerHTML = `${esc(it.title)}<br><small>${esc(it.sub)}</small>`;
        el.addEventListener('click', () => {
          const marker = markers[it.buildingId];
          if (marker) {
            map.flyTo(marker.getLatLng(), 19);
            marker.openPopup();
          }
          results.style.display = 'none';
        });
        results.appendChild(el);
      });
      results.style.display = 'block';
    }

    // ---- Coordinate helper: click anywhere on the map to see its lat/lng. ----
    // Use it to copy exact building coordinates into the admin. Set to false when done.
    const SHOW_COORDS_ON_CLICK = true;
    if (SHOW_COORDS_ON_CLICK) {
      map.on('click', e => {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);
        L.popup()
          .setLatLng(e.latlng)
          .setContent(`<b>Latitude:</b> ${lat}<br><b>Longitude:</b> ${lng}`)
          .openOn(map);
      });
    }

    // ---- Walking directions (external routing API via /api/route/) ----
    const fromSel = document.getElementById('dir-from');
    const toSel = document.getElementById('dir-to');
    const dirInfo = document.getElementById('dir-info');
    let routeLayer = null;

    function fillDirectionSelects(buildings) {
      [fromSel, toSel].forEach(sel => {
        sel.innerHTML = '';
        buildings.forEach(b => {
          const opt = document.createElement('option');
          opt.value = b.id;
          opt.textContent = b.name;
          sel.appendChild(opt);
        });
      });
      if (buildings.length > 1) toSel.selectedIndex = 1;   // default: two different buildings
    }

    function clearRoute() {
      if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
      dirInfo.textContent = '';
    }

    async function getDirections() {
      clearRoute();
      dirInfo.textContent = 'Finding route...';
      try {
        const res = await fetch(
          `/api/route/?from=${encodeURIComponent(fromSel.value)}&to=${encodeURIComponent(toSel.value)}`
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Route unavailable');

        routeLayer = L.geoJSON(data.geometry, {
          style: { color: '#f58220', weight: 6, opacity: 0.9 },
        }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [60, 60] });

        const mins = Math.max(1, Math.round(data.duration / 60));
        dirInfo.textContent = `${data.distance} m \u00B7 about ${mins} min walk`;
      } catch (err) {
        dirInfo.textContent = err.message;
      }
    }

    document.getElementById('dir-go').addEventListener('click', getDirections);
    document.getElementById('dir-clear').addEventListener('click', clearRoute);

    loadBuildings();
  </script>
</body>
</html>
