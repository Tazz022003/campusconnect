{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusConnect{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'campus/css/auth.css' %}">
</head>
<body class="auth-body">
  <div class="auth-card card {% block card_class %}{% endblock %}">
    <div class="card-body p-3 p-sm-4">
      <div class="text-center mb-3">
        <div class="auth-logo"><i class="bi bi-geo-alt-fill"></i> Campus<span>Connect</span></div>
        <div class="text-muted small">Palawan State University &middot; Main Campus</div>
      </div>

      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">{{ message }}</div>
      {% endfor %}

      {% block content %}{% endblock %}
    </div>
  </div>
  <script src="{% static 'campus/js/auth.js' %}"></script>
</body>
</html>
